name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run all validation and packaging steps without publishing.
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag to publish under. Use next for a release candidate.
        type: choice
        default: latest
        options:
          - latest
          - next

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    # contents: write is needed by the final step, which creates the git tag and
    # the GitHub Release. GitHub scopes permissions to a workflow or a job and
    # never to a single step, so a dedicated job is the narrowest available
    # scope; this job is already gated by the npm-publish environment.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Runs before any setup so an inconsistent release request fails in
      # seconds. The release-notes check in particular must happen here: it is
      # what makes a published-but-unreleasable version impossible.
      - name: Validate release inputs
        id: release
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' packages/effect-spacetimedb/package.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "packages/effect-spacetimedb/package.json has no version" >&2
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version $version (prerelease=$prerelease), dist-tag $DIST_TAG"
          if [ "$DIST_TAG" = "latest" ] && [ "$prerelease" = "true" ]; then
            echo "refusing to publish prerelease $version under the latest dist-tag" >&2
            exit 1
          fi
          if [ "$DIST_TAG" = "next" ] && [ "$prerelease" = "false" ]; then
            echo "refusing to publish release $version under the next dist-tag" >&2
            exit 1
          fi
          notes=".github/release-notes/$version.md"
          if [ "$DIST_TAG" = "latest" ]; then
            if [ ! -s "$notes" ]; then
              echo "missing or empty release notes: $notes" >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "tag v$version already exists; bump the version or delete the tag" >&2
              exit 1
            fi
          fi
          {
            printf 'notes=%s\n' "$notes"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - uses: ./.github/actions/setup-spacetimedb
      - run: bun --cwd=packages/effect-spacetimedb run codegen:check
      - run: bun --cwd=packages/effect-spacetimedb run smoke:packed-codegen
      - run: bun --cwd=packages/effect-spacetimedb run smoke:dev-server-node
      - run: bun --cwd=packages/effect-spacetimedb run test:live
      - name: Pack and validate
        working-directory: packages/effect-spacetimedb
        run: |
          set -euo pipefail
          bun run pack:archive
          shopt -s nullglob
          tarballs=(.tmp/publish/effect-spacetimedb-*.tgz)
          test "${#tarballs[@]}" -eq 1
          node scripts/attw.mjs "${tarballs[0]}"
          printf '%s\n' "${tarballs[0]}" > .npm-pack-tarball
      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/effect-spacetimedb
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          IFS= read -r tarball < .npm-pack-tarball
          test -f "$tarball"
          npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
      # Only a latest publish is tagged and released. A next publish is a
      # release candidate whose whole purpose is to be installed once and
      # replaced; tagging every candidate would leave permanent tags and
      # Releases pointing at commits nobody should build on, and the canonical
      # notes are the ones written for the final version. The candidate stays
      # discoverable on npm under the next dist-tag.
      - name: Tag and release
        if: ${{ !inputs.dry_run && inputs.dist_tag == 'latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.release.outputs.notes }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # gh release create makes the tag itself, at --target, when the tag
          # does not already exist; the validation step above proved it does
          # not. That is what contents: write is for.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$NOTES" \
            --latest
